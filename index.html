<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Crucial tag that enables mobile device responsiveness -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>"M" Servicios de Piscina</title>
<style>
    /* Resets margins and centers everything vertically on the screen */
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: Arial, sans-serif;
        background-color: #0b1a30; /* Matches your image's dark blue background */
    }

    /* Container holding the background design and buttons */
    .splash-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        width: 100%;
        box-sizing: border-box;
        padding: 20px;
    }

    /* Target logo configuration */
    .logo-img {
        max-width: 100%;
        height: auto;
        /* Limits logo size on desktop so it isn't overwhelming */
        width: 600px; 
        margin-bottom: 40px;
    }

    /* Button formatting and sizing wrapper */
    .button-group {
        display: flex;
        flex-direction: column;
        gap: 15px; /* Slightly tighter spacing between buttons */
        width: 100%;
        max-width: 240px; /* Reduced from 320px to make them narrower */
    }

    /* Styling for the interactive language link blocks */
    .lang-button {
        display: block;
        text-align: center;
        padding: 12px 0; /* Reduced from 18px to make them thinner/shorter */
        font-size: 1.1rem; /* Slightly smaller text for better proportion */
        font-weight: bold;
        color: #ffffff;
        text-transform: uppercase;
        text-decoration: none;
        letter-spacing: 1px;
        background: linear-gradient(180deg, #1d82cd 0%, #15609a 100%);
        border: 2px solid #33a2f1;
        border-radius: 6px; /* Slightly crisper corners for the smaller size */
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        transition: all 0.2s ease-in-out;
    }

    /* Smooth glow effect when a mouse user hovers over a button */
    .lang-button:hover {
        background: linear-gradient(180deg, #2494e6 0%, #1971b5 100%);
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(51, 162, 241, 0.4);
    }
</style>
</head>

<body>

    <div class="splash-container">
        <!-- Logo Display -->
        <img src="logo-lge.jpg" class="logo-img" alt="Servicios de Piscinas Logo">
		<p>(Pool Services)</p>

        <!-- Native Interactive Button System -->
        <div class="button-group">
            <a href="index-en.html" class="lang-button">English</a>
            <a href="index-es.html" class="lang-button">Español</a>
        </div>
    </div>
	
</body>
</html>
